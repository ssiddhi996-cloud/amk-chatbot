<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMK Hospitality IPL - Concierge</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-maroon: #581825;
            --accent-gold: #D4AF37;
            --light-cream: #FAF6F0;
            --card-bg: #FFFFFF;
            --text-dark: #2C221E;
            --bot-bubble: #F3EAE1;
            --user-bubble: #581825;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #FAF6F0 0%, #F0E6D8 100%);
            margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh;
        }

        .chat-container {
            width: 420px; height: 650px; background: var(--card-bg);
            border-radius: 16px; box-shadow: 0 12px 40px rgba(88, 24, 37, 0.15);
            display: flex; flex-direction: column; overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.3); flex-shrink: 0;
        }

        .chat-header {
            background: var(--primary-maroon); color: var(--light-cream);
            padding: 20px; text-align: center; border-bottom: 2px solid var(--accent-gold);
            flex-shrink: 0;
        }

        .chat-header h1 {
            font-family: 'Cormorant Garamond', serif; margin: 0; font-size: 22px; letter-spacing: 1px; color: #FDF9F5;
        }

        .chat-header p {
            margin: 4px 0 0 0; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--accent-gold);
        }

        .chat-messages {
            flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: var(--light-cream);
        }

        .message {
            max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 13.5px; line-height: 1.5; box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .message.bot {
            background: var(--bot-bubble); color: var(--text-dark); align-self: flex-start;
            border-bottom-left-radius: 3px; border-left: 3px solid var(--accent-gold);
        }

        .message.user {
            background: var(--user-bubble); color: #FFFFFF; align-self: flex-end; border-bottom-right-radius: 3px;
        }

        .chat-input-area {
            display: flex; padding: 14px; background: #FFFFFF; border-top: 1px solid #E6DCCD;
            flex-shrink: 0;
        }

        .chat-input-area input {
            flex: 1; padding: 12px 14px; border: 1px solid #D1C3B4; border-radius: 8px; outline: none;
            font-size: 14px; font-family: 'Plus Jakarta Sans', sans-serif; background: #FAFAFA; transition: all 0.3s ease;
        }

        .chat-input-area input:focus {
            border-color: var(--accent-gold); background: #FFFFFF; box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.15);
        }

        .chat-input-area button {
            background: var(--primary-maroon); color: var(--accent-gold); border: 1px solid var(--accent-gold);
            padding: 10px 20px; margin-left: 10px; border-radius: 8px; cursor: pointer; font-weight: 600;
            font-family: 'Plus Jakarta Sans', sans-serif; transition: all 0.2s ease;
        }

        .chat-input-area button:hover {
            background: #40111B; color: #FFFFFF;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>AMK Hospitality IPL</h1>
            <p>Bespoke Weddings & Travels Concierge</p>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">Namaste & welcome to <b>AMK Hospitality IPL</b>. 🙏 I'm your personal concierge. Are you looking to plan a majestic <b>Wedding/Event</b> or book an exclusive <b>Travel Package</b>?</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Share your requirement or ask a question..." onkeypress="handleKey(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        let session = { step: 0, intent: '', details: {}, contact: {} };

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const messages = document.getElementById('chatMessages');
            const text = input.value.trim();
            if (!text) return;

            messages.innerHTML += `<div class="message user">${text}</div>`;
            input.value = '';
            messages.scrollTop = messages.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, session: session })
                });
                const data = await res.json();
                session = data.session;

                messages.innerHTML += `<div class="message bot">${data.response}</div>`;
                messages.scrollTop = messages.scrollHeight;
            } catch (err) {
                messages.innerHTML += `<div class="message bot">⚠️ Connection error. Please try again.</div>`;
            }
        }

        function handleKey(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
